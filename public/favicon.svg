<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="#150826" />

  <!-- Ghost Body -->
  <path d="M 32 64 C 32 40, 68 40, 68 64 C 68 76, 62 76, 59 72 C 56 68, 53 68, 50 72 C 47 76, 44 76, 41 72 C 38 68, 35 68, 32 72 Z" fill="url(#accentGrad)"/>
  
  <!-- Ghost Face / Eyes -->
  <circle cx="44" cy="50" r="3.5" fill="#ffffff" />
  <circle cx="56" cy="50" r="3.5" fill="#ffffff" />
  <circle cx="45.5" cy="50" r="1.8" fill="#150826" />
  <circle cx="57.5" cy="50" r="1.8" fill="#150826" />

  <!-- Trending / Growth Arrows Behind Magnifier -->
  <path d="M 22 55 L 29 45 L 34 50 L 44 36" stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <polygon points="41,33 48,34 46,41" fill="#38bdf8" />

  <!-- Magnifying Glass Lens Outer -->
  <circle cx="52" cy="52" r="22" stroke="url(#primaryGrad)" stroke-width="5" fill="url(#glassGrad)"/>
  
  <!-- Magnifying Glass Handle -->
  <line x1="68" y1="68" x2="84" y2="84" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="84" cy="84" r="3" fill="#38bdf8" />

  <!-- Crosshair / Precision Focus Targets -->
  <circle cx="52" cy="52" r="9" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 2" fill="none" opacity="0.9"/>
  <line x1="52" y1="39" x2="52" y2="43" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="61" x2="52" y2="65" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="39" y1="52" x2="43" y2="52" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="61" y1="52" x2="65" y2="52" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="52" cy="52" r="2" fill="#38bdf8" />
</svg>
