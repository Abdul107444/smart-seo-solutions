<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <filter id="shadow-card" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-opacity="0.1" flood-color="#000000"/>
    </filter>
    <filter id="shadow-bubble" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.18" flood-color="#000000"/>
    </filter>
    <clipPath id="avatar-clip">
      <circle cx="150" cy="155" r="54"/>
    </clipPath>
    <clipPath id="small-avatar-clip">
      <circle cx="36" cy="38" r="16"/>
    </clipPath>
    <clipPath id="bubble-avatar-clip">
      <circle cx="28" cy="26" r="14"/>
    </clipPath>
    <clipPath id="gig-thumb-clip">
      <rect x="0" y="0" width="310" height="85" rx="6"/>
    </clipPath>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ================= TOP SELLER HEADER ================= -->

  <!-- Avatar Circle with border and photo -->
  <circle cx="150" cy="155" r="56" fill="#f4b251"/>
  <image href="/techpulse-assets/aqacca-avatar.jpg" x="96" y="101" width="108" height="108" clip-path="url(#avatar-clip)" preserveAspectRatio="xMidYMid slice"/>
  <circle cx="150" cy="155" r="54" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Seller Name & Top Info -->
  <g transform="translate(225, 105)">
    <!-- Name and username -->
    <text x="0" y="24" fill="#222325" font-size="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800">AQACCA</text>
    <text x="115" y="24" fill="#74767e" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400">@aqacca</text>

    <!-- Star Rating & Level 2 Badge -->
    <g transform="translate(0, 48)">
      <polygon points="0,0 2.5,7 9.5,7 4,11 6,18 0,13.5 -6,18 -4,11 -9.5,7 -2.5,7" fill="#222325" transform="translate(8, 0) scale(0.8)"/>
      <text x="22" y="5" fill="#222325" font-size="14.5" font-family="sans-serif" font-weight="800">4.9</text>
      <text x="49" y="5" fill="#2563eb" font-size="14" font-family="sans-serif" font-weight="500">(1.0k)</text>
      <text x="96" y="5" fill="#222325" font-size="13.5" font-family="sans-serif" font-weight="700">Level 2</text>
      <text x="146" y="4" fill="#62646a" font-size="10">◆◆</text>
    </g>

    <!-- Headline Tagline -->
    <text x="0" y="85" fill="#404145" font-size="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">UK Accountant Xero, FreeAgent and Quickbooks Certified Advisor</text>

    <!-- Location Pin & Language -->
    <g transform="translate(0, 110)">
      <!-- Location Pin -->
      <path d="M5 2 C2 2 0 4.5 0 7.5 C0 11.5 5 16 5 16 C5 16 10 11.5 10 7.5 C10 4.5 8 2 5 2 Z" fill="#74767e"/>
      <circle cx="5" cy="7" r="2" fill="#ffffff"/>
      <text x="16" y="12" fill="#62646a" font-size="13.5" font-family="sans-serif" font-weight="500">Pakistan</text>

      <!-- Chat Bubble Icon -->
      <path d="M85 4 L97 4 C99 4 100 5 100 7 L100 12 C100 14 99 15 97 15 L90 15 L86 18 L86 15 L85 15 C83 15 82 14 82 12 L82 7 C82 5 83 4 85 4 Z" fill="#74767e"/>
      <text x="106" y="12" fill="#62646a" font-size="13.5" font-family="sans-serif" font-weight="500">English</text>
    </g>
  </g>

  <!-- More About Me Button (Top Right) -->
  <g transform="translate(980, 95)">
    <rect width="130" height="38" rx="6" fill="#ffffff" stroke="#74767e" stroke-width="1"/>
    <text x="65" y="24" fill="#222325" font-size="13.5" font-family="sans-serif" font-weight="700" text-anchor="middle">More about me</text>
  </g>

  <!-- ================= ABOUT ME & SKILLS (LEFT) ================= -->
  <g transform="translate(96, 260)">
    <text x="0" y="0" fill="#222325" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800">About me</text>
    <text x="0" y="26" fill="#62646a" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400">Hello and welcome to my profile! I am a qualified and experienced UK Accountant with over 8 years of</text>
    <text x="0" y="46" fill="#62646a" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400">hands-on experience in accountancy, taxation, and business advisory services. I am also the Managing</text>
    <text x="0" y="66" fill="#62646a" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400">
      Director of a UK-based accountancy practice that proudly serves more than 2,000 satisfie... 
      <tspan fill="#222325" font-weight="700" text-decoration="underline">Read more</tspan>
    </text>

    <!-- Skills Header -->
    <text x="0" y="105" fill="#222325" font-size="14.5" font-family="sans-serif" font-weight="800">Skills</text>

    <!-- Skills Pills -->
    <g transform="translate(0, 118)">
      <!-- Skill 1 -->
      <rect x="0" y="0" width="122" height="28" rx="14" fill="#ffffff" stroke="#e4e5e7" stroke-width="1.2"/>
      <text x="61" y="18" fill="#404145" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="middle">Account manager</text>
      <!-- Skill 2 -->
      <rect x="130" y="0" width="90" height="28" rx="14" fill="#ffffff" stroke="#e4e5e7" stroke-width="1.2"/>
      <text x="175" y="18" fill="#404145" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="middle">Accountant</text>
      <!-- Skill 3 -->
      <rect x="228" y="0" width="158" height="28" rx="14" fill="#ffffff" stroke="#e4e5e7" stroke-width="1.2"/>
      <text x="307" y="18" fill="#404145" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="middle">Microsoft Excel expert</text>
      <!-- Skill 4 -->
      <rect x="394" y="0" width="126" height="28" rx="14" fill="#ffffff" stroke="#e4e5e7" stroke-width="1.2"/>
      <text x="457" y="18" fill="#404145" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="middle">Data entry expert</text>
      <!-- Skill 5 -->
      <rect x="528" y="0" width="102" height="28" rx="14" fill="#ffffff" stroke="#e4e5e7" stroke-width="1.2"/>
      <text x="579" y="18" fill="#404145" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="middle">Bookkeeper</text>
      <!-- Skill +4 -->
      <text x="642" y="18" fill="#222325" font-size="13" font-family="sans-serif" font-weight="700" text-decoration="underline">+4</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: HOURLY CONSULTATION CARD ================= -->
  <g transform="translate(780, 205)">
    <rect width="330" height="210" rx="8" fill="#ffffff" stroke="#e4e5e7" stroke-width="1" filter="url(#shadow-card)"/>

    <!-- Small Avatar & Title -->
    <g transform="translate(18, 20)">
      <circle cx="20" cy="20" r="17" fill="#f4b251"/>
      <image href="/techpulse-assets/aqacca-avatar.jpg" x="2" y="2" width="36" height="36" clip-path="url(#small-avatar-clip)" preserveAspectRatio="xMidYMid slice"/>
      <circle cx="20" cy="20" r="16.5" fill="none" stroke="#ffffff" stroke-width="1"/>

      <text x="50" y="14" fill="#222325" font-size="14.5" font-family="sans-serif" font-weight="800">AQACCA</text>
      <text x="50" y="33" fill="#222325" font-size="16" font-family="sans-serif" font-weight="800">PKR 21,800.60<tspan font-size="12.5" font-weight="400" fill="#74767e">/hour</tspan></text>
    </g>

    <!-- Offline status -->
    <g transform="translate(70, 78)">
      <circle cx="0" cy="-3.5" r="3.5" fill="#95979d"/>
      <text x="8" y="0" fill="#74767e" font-size="12" font-family="sans-serif">Offline • 07:04 PM local time</text>
    </g>

    <!-- Contact Me Button -->
    <g transform="translate(20, 96)">
      <rect width="290" height="42" rx="4" fill="#222325"/>
      <!-- Paper Airplane Icon -->
      <g transform="translate(100, 14)">
        <polygon points="0,14 18,7 0,0 2,6 10,7 2,8" fill="#ffffff"/>
      </g>
      <text x="156" y="26" fill="#ffffff" font-size="14" font-family="sans-serif" font-weight="700" text-anchor="middle">Contact me</text>
    </g>

    <!-- Response Time -->
    <text x="165" y="168" fill="#74767e" font-size="12" font-family="sans-serif" text-anchor="middle">Average response time: 1 hour</text>
  </g>

  <!-- ================= LOWER SECTION: SEE MY SERVICES ================= -->
  <g transform="translate(96, 460)">
    <text x="0" y="0" fill="#222325" font-size="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800">See my services</text>
    
    <!-- GIG 1: Bookkeeping -->
    <g transform="translate(0, 20)">
      <rect width="310" height="150" rx="6" fill="#ffffff" stroke="#e4e5e7" stroke-width="1" filter="url(#shadow-card)"/>
      <!-- Header Banner -->
      <g clip-path="url(#gig-thumb-clip)">
        <rect width="310" height="85" fill="#e9eef3"/>
        <!-- Desk photo simulation with software badges -->
        <rect x="20" y="28" width="65" height="28" rx="4" fill="#0077c5"/>
        <text x="52" y="46" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">FreeAgent</text>
        <rect x="92" y="28" width="80" height="28" rx="4" fill="#2ca01c"/>
        <text x="132" y="46" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">QuickBooks</text>
        <rect x="180" y="28" width="60" height="28" rx="4" fill="#13b5ea"/>
        <text x="210" y="46" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">xero</text>
      </g>

      <!-- Category & Title -->
      <text x="14" y="102" fill="#74767e" font-size="11.5" font-family="sans-serif" font-weight="600">Bookkeeping</text>
      <text x="14" y="120" fill="#222325" font-size="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600">I will do bookkeeping and accounting for UK companies</text>
      
      <!-- Rating -->
      <g transform="translate(14, 140)">
        <polygon points="0,0 2,5 7,5 3,8 4.5,13 0,10 -4.5,13 -3,8 -7,5 -2,5" fill="#222325" transform="translate(6, 0) scale(0.65)"/>
        <text x="16" y="8" fill="#222325" font-size="12" font-weight="800">4.9</text>
        <text x="38" y="8" fill="#74767e" font-size="12">(555)</text>
      </g>
    </g>

    <!-- GIG 2: Tax Returns (UK Accountant) -->
    <g transform="translate(330, 20)">
      <rect width="310" height="150" rx="6" fill="#ffffff" stroke="#e4e5e7" stroke-width="1" filter="url(#shadow-card)"/>
      <g clip-path="url(#gig-thumb-clip)">
        <rect width="310" height="85" fill="#edf2f7"/>
        <rect x="25" y="14" width="115" height="56" rx="4" fill="#1a365d"/>
        <text x="82" y="32" fill="#ffffff" font-size="9" font-weight="900" text-anchor="middle">UK ACCOUNTANT</text>
        <text x="82" y="44" fill="#90cdf4" font-size="7" font-weight="700" text-anchor="middle">• Bookkeeping • VAT</text>
        <text x="82" y="55" fill="#90cdf4" font-size="7" font-weight="700" text-anchor="middle">• Company Accounts</text>
        <text x="82" y="65" fill="#90cdf4" font-size="7" font-weight="700" text-anchor="middle">• CT600 Submission</text>
      </g>

      <text x="14" y="102" fill="#74767e" font-size="11.5" font-family="sans-serif" font-weight="600">Tax Returns</text>
      <text x="14" y="120" fill="#222325" font-size="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600">I will do UK company accounts and tax returns</text>

      <g transform="translate(14, 140)">
        <polygon points="0,0 2,5 7,5 3,8 4.5,13 0,10 -4.5,13 -3,8 -7,5 -2,5" fill="#222325" transform="translate(6, 0) scale(0.65)"/>
        <text x="16" y="8" fill="#222325" font-size="12" font-weight="800">4.9</text>
        <text x="38" y="8" fill="#74767e" font-size="12">(186)</text>
      </g>
    </g>

    <!-- GIG 3: Tax Returns (HM Revenue & Customs) -->
    <g transform="translate(660, 20)">
      <rect width="310" height="150" rx="6" fill="#ffffff" stroke="#e4e5e7" stroke-width="1" filter="url(#shadow-card)"/>
      <g clip-path="url(#gig-thumb-clip)">
        <rect width="310" height="85" fill="#f0fdf4"/>
        <rect x="25" y="12" width="130" height="60" rx="4" fill="#064e3b"/>
        <text x="90" y="28" fill="#ffffff" font-size="8" font-weight="900" text-anchor="middle">HM Revenue &amp; Customs</text>
        <text x="90" y="40" fill="#6ee7b7" font-size="6.5" text-anchor="middle">• UK Corporation Tax</text>
        <text x="90" y="50" fill="#6ee7b7" font-size="6.5" text-anchor="middle">• Accounts Submission</text>
        <text x="90" y="60" fill="#6ee7b7" font-size="6.5" text-anchor="middle">• Personal Tax Planning</text>
      </g>

      <text x="14" y="102" fill="#74767e" font-size="11.5" font-family="sans-serif" font-weight="600">Tax Returns</text>
      <text x="14" y="120" fill="#222325" font-size="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600">I will be your accountant and UK tax advisor</text>

      <g transform="translate(14, 140)">
        <polygon points="0,0 2,5 7,5 3,8 4.5,13 0,10 -4.5,13 -3,8 -7,5 -2,5" fill="#222325" transform="translate(6, 0) scale(0.65)"/>
        <text x="16" y="8" fill="#222325" font-size="12" font-weight="800">5.0</text>
        <text x="38" y="8" fill="#74767e" font-size="12">(142)</text>
      </g>
    </g>
  </g>

  <!-- ================= FLOATING MESSAGE BUBBLE (BOTTOM LEFT) ================= -->
  <g transform="translate(10, 560)" filter="url(#shadow-bubble)">
    <rect width="195" height="48" rx="24" fill="#ffffff" stroke="#e4e5e7"/>
    <circle cx="28" cy="24" r="14" fill="#f4b251"/>
    <image href="/techpulse-assets/aqacca-avatar.jpg" x="14" y="10" width="28" height="28" clip-path="url(#bubble-avatar-clip)" preserveAspectRatio="xMidYMid slice"/>
    <circle cx="38" cy="32" r="3.5" fill="#95979d" stroke="#ffffff" stroke-width="1"/>

    <text x="50" y="21" fill="#222325" font-size="11.5" font-family="sans-serif" font-weight="800">Message AQACCA</text>
    <text x="50" y="34" fill="#74767e" font-size="10" font-family="sans-serif">Away • Avg. response time: 1 Hour</text>
  </g>

</svg>
