<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 680" width="420" height="680">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <clipPath id="avatarClip">
      <circle cx="95" cy="38" r="18"/>
    </clipPath>
    <clipPath id="cardClip">
      <rect x="24" y="90" width="280" height="410" rx="14"/>
    </clipPath>
  </defs>

  <!-- WhatsApp Dark Background -->
  <rect width="100%" height="100%" fill="#0c1317"/>

  <!-- Subtle WhatsApp Chat Doodle Background Effect -->
  <rect width="100%" height="100%" fill="#111b21" opacity="0.95"/>

  <!-- Top WhatsApp Header Bar -->
  <rect width="100%" height="70" fill="#202c33"/>
  
  <!-- Back arrow & counter -->
  <path d="M22 38 L34 26 M22 38 L34 50" stroke="#aebac1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="42" y="44" fill="#aebac1" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">18</text>

  <!-- Contact Avatar -->
  <circle cx="95" cy="38" r="18" fill="#1dbf73"/>
  <text x="95" y="44" fill="#ffffff" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">HS</text>

  <!-- Contact Name & Subtitle -->
  <text x="124" y="36" fill="#e9edef" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold">Hamza (Fiverr Web Dev)</text>
  <text x="124" y="52" fill="#8696a0" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">online</text>

  <!-- Video Call & Phone Call Icons -->
  <!-- Video Cam -->
  <rect x="330" y="28" width="20" height="15" rx="3" stroke="#aebac1" stroke-width="2" fill="none"/>
  <polygon points="350,32 360,26 360,45 350,39" fill="#aebac1"/>
  <!-- Phone -->
  <path d="M380 28 C380 28 385 28 387 31 C389 34 388 37 386 39 C390 44 394 48 399 52 C401 50 404 49 407 51 C410 53 410 58 410 58 C410 58 405 60 400 58 C390 54 380 44 376 34 C374 29 376 28 380 28 Z" fill="#aebac1" transform="scale(0.85) translate(45, -3)"/>

  <!-- Shared Screenshot Message Bubble in WhatsApp -->
  <!-- White Card Container -->
  <rect x="24" y="90" width="280" height="400" rx="14" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Card Top Banner -->
  <rect x="24" y="90" width="280" height="4" rx="2" fill="#1dbf73"/>

  <!-- Card Inner: Fiverr Earnings Header -->
  <text x="40" y="125" fill="#111827" font-size="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800">Fiverr Earnings</text>
  <circle cx="140" cy="120" r="6" stroke="#9ca3af" stroke-width="1.2" fill="none"/>
  <text x="140" y="123" fill="#6b7280" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">i</text>
  <text x="275" y="125" fill="#1dbf73" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="end">See all</text>

  <text x="40" y="145" fill="#6b7280" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Last 30 days: Active Orders Cleared</text>

  <!-- Big Earnings Display -->
  <text x="164" y="195" fill="#111827" font-size="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle">$1,450.00</text>
  <text x="164" y="215" fill="#4b5563" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Net Income Cleared (USD)</text>
  
  <rect x="90" y="224" width="148" height="20" rx="10" fill="#ecfdf5"/>
  <text x="164" y="238" fill="#059669" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">↑ +340% from previous 30 days</text>

  <!-- Divider -->
  <line x1="40" y1="256" x2="288" y2="256" stroke="#f3f4f6" stroke-width="1.5"/>

  <!-- Breakdown Rows -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Row 1 -->
    <text x="40" y="280" fill="#1f2937" font-size="12" font-weight="700">Custom Offer ($450 Deal)</text>
    <text x="288" y="280" fill="#111827" font-size="12" font-weight="800" text-anchor="end">$450.00</text>
    <text x="288" y="293" fill="#059669" font-size="9.5" font-weight="600" text-anchor="end">↑ 100% Accepted</text>

    <!-- Row 2 -->
    <text x="40" y="316" fill="#1f2937" font-size="12" font-weight="700">Recurring Client Retainer</text>
    <text x="288" y="316" fill="#111827" font-size="12" font-weight="800" text-anchor="end">$600.00</text>
    <text x="288" y="329" fill="#059669" font-size="9.5" font-weight="600" text-anchor="end">↑ Monthly Contract</text>

    <!-- Row 3 -->
    <text x="40" y="352" fill="#1f2937" font-size="12" font-weight="700">Standard Tier Gigs</text>
    <text x="288" y="352" fill="#111827" font-size="12" font-weight="800" text-anchor="end">$400.00</text>
    <text x="288" y="365" fill="#059669" font-size="9.5" font-weight="600" text-anchor="end">↑ 5-Star Reviews</text>
  </g>

  <!-- Performance Mini Box inside screenshot -->
  <rect x="36" y="380" width="256" height="74" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="402" fill="#0c172f" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold">Fiverr Performance Level:</text>
  <rect x="210" y="390" width="72" height="18" rx="9" fill="#1dbf73"/>
  <text x="246" y="403" fill="#ffffff" font-size="9.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">Level 2 Seller</text>
  
  <text x="48" y="424" fill="#64748b" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Search Placement: <tspan fill="#059669" font-weight="bold">Page 1 Top Row</tspan></text>
  <text x="48" y="442" fill="#64748b" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Success Score: <tspan fill="#0c172f" font-weight="bold">10 / 10 (Highest Score)</tspan></text>

  <!-- Timestamp inside card -->
  <text x="285" y="480" fill="#9ca3af" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="end">4:13 PM</text>

  <!-- Forward icon circle beside card -->
  <circle cx="330" cy="270" r="16" fill="#202c33"/>
  <path d="M326 270 L334 265 M326 270 L334 275 M334 270 L324 270" stroke="#8696a0" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Heart Reaction on Card -->
  <circle cx="50" cy="495" r="14" fill="#202c33" stroke="#0c1317" stroke-width="2"/>
  <text x="50" y="500" font-size="12" text-anchor="middle">❤️</text>

  <!-- WhatsApp Chat Bubble 1 below card -->
  <rect x="24" y="515" width="285" height="66" rx="10" fill="#202c33"/>
  <path d="M24 522 L14 515 L24 532 Z" fill="#202c33"/>
  <text x="36" y="536" fill="#e9edef" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500">Bhai Alhamdulillah! Optimization ke baad</text>
  <text x="36" y="554" fill="#e9edef" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500">US client ne 450$ ka custom offer accept</text>
  <text x="36" y="572" fill="#e9edef" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500">kar liya hai is month 🤗</text>
  <text x="296" y="574" fill="#8696a0" font-size="9.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="end">4:13 PM</text>

  <!-- WhatsApp Chat Bubble 2 below -->
  <rect x="24" y="590" width="310" height="74" rx="10" fill="#202c33"/>
  <path d="M24 597 L14 590 L24 607 Z" fill="#202c33"/>
  <text x="36" y="611" fill="#e9edef" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Dead gig Page 1 par rank hone se buyers ke</text>
  <text x="36" y="628" fill="#e9edef" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">messages continuous aa rahe hain. 8,000 PKR</text>
  <text x="36" y="645" fill="#e9edef" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">fee usi pehle order se 100x recover ho gayi! ❤️</text>
  <text x="320" y="658" fill="#8696a0" font-size="9.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="end">4:14 PM</text>
</svg>