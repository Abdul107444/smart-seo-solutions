<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 680" width="420" height="680">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- WhatsApp Dark Background -->
  <rect width="100%" height="100%" fill="#0c1317"/>
  <rect width="100%" height="100%" fill="#111b21" opacity="0.95"/>

  <!-- Top WhatsApp Header Bar -->
  <rect width="100%" height="70" fill="#202c33"/>
  
  <!-- Back arrow & counter -->
  <path d="M22 38 L34 26 M22 38 L34 50" stroke="#aebac1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
