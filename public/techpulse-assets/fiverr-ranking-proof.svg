  <text x="46" y="306" fill="#e9edef" font-size="22" font-family="sans-serif" font-weight="900">48,240</text>
  <text x="46" y="326" fill="#25d366" font-size="11" font-family="sans-serif" font-weight="bold">↑ +340% Organic</text>

