  <path d="M380 28 C380 28 385 28 387 31 C389 34 388 37 386 39 C390 44 394 48 399 52 C401 50 404 49 407 51 C410 53 410 58 410 58 C410 58 405 60 400 58 C390 54 380 44 376 34 C374 29 376 28 380 28 Z" fill="#aebac1" transform="scale(0.85) translate(45, -3)"/>

  <!-- Top Chat Bubble: "Bhai" -->
  <rect x="24" y="85" width="85" height="34" rx="8" fill="#202c33"/>
  <path d="M24 92 L15 86 L24 100 Z" fill="#202c33"/>
  <text x="36" y="106" fill="#e9edef" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Bhai</text>
  <text x="98" y="106" fill="#8696a0" font-size="9" font-family="sans-serif" text-anchor="end">8:50 AM</text>

