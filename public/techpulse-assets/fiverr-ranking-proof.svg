  <rect x="36" y="442" width="261" height="60" rx="8" fill="#111b21"/>
  <text x="46" y="458" fill="#8696a0" font-size="9.5" font-family="sans-serif">OPTIMIZATION DELIVERABLES APPLIED:</text>
  <text x="46" y="474" fill="#25d366" font-size="10" font-family="sans-serif" font-weight="bold">✓ 5 Low-Competition Intent Tags Infiltrated</text>
  <text x="46" y="490" fill="#25d366" font-size="10" font-family="sans-serif" font-weight="bold">✓ Permanent Keyword URL &amp; AIDA Description</text>

  <!-- Forward icon circle beside card -->
  <circle cx="330" cy="340" r="16" fill="#202c33"/>
  <path d="M326 340 L334 335 M326 340 L334 345 M334 340 L324 340" stroke="#8696a0" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Timestamp inside card -->
  <text x="296" y="540" fill="#8696a0" font-size="9.5" font-family="sans-serif" text-anchor="end">8:50 AM</text>

  <!-- WhatsApp Chat Bubble below -->
  <rect x="24" y="565" width="295" height="54" rx="10" fill="#202c33"/>
  <path d="M24 572 L14 565 L24 582 Z" fill="#202c33"/>
  <text x="36" y="588" fill="#e9edef" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">Gig Page 1 par rank ho gayi hai 😍</text>
  <text x="36" y="607" fill="#e9edef" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Viral impressions aur daily clicks aa rahe hain!</text>
  <text x="306" y="609" fill="#8696a0" font-size="9.5" font-family="sans-serif" text-anchor="end">8:50 AM</text>

  <!-- Second WhatsApp Bubble -->
  <rect x="24" y="626" width="310" height="46" rx="10" fill="#202c33"/>
  <path d="M24 633 L14 626 L24 643 Z" fill="#202c33"/>
  <text x="36" y="645" fill="#e9edef" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Pehle zero impressions the, ab roz buyer messages</text>
  <text x="36" y="661" fill="#e9edef" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">aate hain inbox me. Best optimization service!</text>
  <text x="320" y="663" fill="#8696a0" font-size="9.5" font-family="sans-serif" text-anchor="end">8:51 AM</text>
