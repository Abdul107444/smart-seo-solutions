  <text x="182" y="306" fill="#e9edef" font-size="22" font-family="sans-serif" font-weight="900">1,420</text>
  <text x="182" y="326" fill="#25d366" font-size="11" font-family="sans-serif" font-weight="bold">8.4% CTR (High)</text>

  <!-- Box 3: Search Placement -->
  <rect x="36" y="348" width="125" height="85" rx="10" fill="#202c33"/>
  <text x="46" y="368" fill="#8696a0" font-size="10.5" font-family="sans-serif">Search Placement</text>
  <text x="46" y="398" fill="#1dbf73" font-size="19" font-family="sans-serif" font-weight="900">Page 1 #3</text>
  <text x="46" y="418" fill="#00bad2" font-size="10.5" font-family="sans-serif" font-weight="bold">Top 3 Row in US</text>

  <!-- Box 4: Inbound Orders -->
  <rect x="172" y="348" width="125" height="85" rx="10" fill="#202c33"/>
  <text x="182" y="368" fill="#8696a0" font-size="10.5" font-family="sans-serif">Orders Completed</text>
  <text x="182" y="398" fill="#e9edef" font-size="22" font-family="sans-serif" font-weight="900">14 Orders</text>
  <text x="182" y="418" fill="#fab72a" font-size="10.5" font-family="sans-serif" font-weight="bold">⭐⭐⭐⭐⭐ 5.0</text>

