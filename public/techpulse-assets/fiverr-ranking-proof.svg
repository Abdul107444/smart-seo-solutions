  <!-- Contact Avatar -->
  <circle cx="95" cy="38" r="18" fill="#2b62ef"/>
  <text x="95" y="44" fill="#ffffff" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">NB</text>

  <!-- Contact Name & Subtitle -->
  <text x="124" y="36" fill="#e9edef" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold">Nimra (Fiverr UI/UX Client)</text>
  <text x="124" y="52" fill="#8696a0" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">online</text>

