          <text x="210" y="5" fill="#74767e" font-size="10.5" font-family="sans-serif" font-weight="bold">STARTING AT</text>
          <text x="340" y="6" fill="#222325" font-size="17" font-family="sans-serif" font-weight="900" text-anchor="end">$85</text>
