    <text x="230" y="21" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">HS</text>
    <circle cx="242" cy="26" r="4.5" fill="#1dbf73" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Page Content Container -->
