<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25" flood-color="#000000"/>
    </filter>
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ffb300" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="trs-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c172f"/>
      <stop offset="100%" stop-color="#142850"/>
    </linearGradient>
    <linearGradient id="fiverr-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1dbf73"/>
      <stop offset="100%" stop-color="#109655"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#f4f7f9"/>

  <!-- Top Global Fiverr Bar -->
  <rect width="100%" height="60" fill="#ffffff" stroke="#e4e5e7" stroke-width="1"/>
  
  <!-- Fiverr Logo -->
  <g transform="translate(36, 16)">
    <circle cx="14" cy="14" r="14" fill="#1dbf73"/>
    <text x="14" y="20" fill="#ffffff" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle">fi.</text>
    <text x="36" y="21" fill="#404145" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" letter-spacing="-0.5">fiverr</text>
    <text x="96" y="14" fill="#1dbf73" font-size="11" font-family="sans-serif" font-weight="bold">PRO</text>
  </g>

  <!-- Search Bar Simulation -->
  <rect x="180" y="12" width="460" height="36" rx="4" fill="#ffffff" stroke="#c5c6c9" stroke-width="1"/>
  <text x="196" y="35" fill="#74767e" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Fiverr Gig SEO &amp; Algorithm Optimization...</text>
  <rect x="590" y="12" width="50" height="36" rx="4" fill="#222325"/>
  <circle cx="612" cy="27" r="6" stroke="#ffffff" stroke-width="2" fill="none"/>
  <line x1="616" y1="31" x2="624" y2="39" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Top Right Seller Status Bar -->
