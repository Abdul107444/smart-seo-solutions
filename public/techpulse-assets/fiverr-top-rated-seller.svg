      <text x="290" y="39" fill="#ffffff" font-size="10.5" font-family="sans-serif" font-weight="900" text-anchor="middle">VERIFIED GIG</text>

      <!-- Gig Details Content -->
      <g transform="translate(16, 212)">
        <!-- Seller Small Info -->
        <circle cx="12" cy="12" r="12" fill="#1dbf73"/>
        <text x="12" y="16" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">HS</text>
        <text x="32" y="16" fill="#222325" font-size="12" font-family="sans-serif" font-weight="bold">Hamza Shahid</text>
        <text x="340" y="16" fill="#ffb300" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="end">Top Rated</text>

