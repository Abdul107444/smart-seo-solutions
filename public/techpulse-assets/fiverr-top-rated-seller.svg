    <path d="M145 14 C145 10 155 10 155 14 L157 20 L143 20 Z" fill="#74767e"/>
    <!-- Inbox Mail -->
    <rect x="180" y="9" width="18" height="13" rx="2" fill="none" stroke="#74767e" stroke-width="1.8"/>
    <!-- Avatar with Online Dot -->
